data:
  db_path: MultiAgent4Collusion-master/our_twitter_sim/test.db
  csv_path: MultiAgent4Collusion-master/our_twitter_sim/input_agents.csv


simulation:
  num_timesteps: 5
  clock_factor: 60
  recsys_type: twhin-bert
  reflection: True
  shared_reflection: True
  detection: True

model:
  num_agents: 72
  model_random_seed: NULL
  cfgs:
    - model_type: glm-4-flash
      num: 72
      server_url: https://open.bigmodel.cn/api/paas/v4/
      model_path: openai
      stop_tokens: []
      temperature: 0.7

inference:
  model_type: glm-4-flash
  model_path: openai
  stop_tokens: []
  timeout: 30000
  server_url:
    - host: open.bigmodel.cn
      ports: [443]

defense:
  strategy: ban
  gap: 5
