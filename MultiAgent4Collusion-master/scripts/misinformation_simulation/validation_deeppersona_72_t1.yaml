data:
  db_path: our_twitter_sim/validation_deeppersona_official_72_t1.db
  csv_path: our_twitter_sim/deeppersona_official_72.csv

simulation:
  num_timesteps: 1
  clock_factor: 60
  recsys_type: random
  reflection: false
  shared_reflection: false
  detection: false
  activation_scale: 1.0
  force_all_agents_active: true

model:
  num_agents: 72
  model_random_seed: 42
  cfgs:
    - model_type: qwen3.5:9b
      num: 72
      server_url: http://127.0.0.1:11434/v1
      model_path: openai
      stop_tokens: []
      temperature: 0.0

inference:
  model_type: qwen3.5:9b
  model_path: openai
  stop_tokens: []
  timeout: 300
  server_url:
    - host: 127.0.0.1
      ports: [11434]
