data:
  db_path: our_twitter_sim/independent_72_t1_seed42.db
  csv_path: ../data/72agent_independent.csv

simulation:
  num_timesteps: 1
  clock_factor: 60
  recsys_type: random
  reflection: false
  shared_reflection: false
  detection: false
  activation_scale: 1.0
  force_all_agents_active: true

model:
  num_agents: 72
  model_random_seed: 42
  cfgs:
    - model_type: qwen3.5:9b
      num: 72
      server_url: http://127.0.0.1:11434/v1
      model_path: openai
      stop_tokens: []
      temperature: 0.0

inference:
  model_type: qwen3.5:9b
  model_path: openai
  stop_tokens: []
  timeout: 300
  server_url:
    - host: 127.0.0.1
      ports: [11434]

# Strict independent baseline. Same population, network, initial posts,
# recommendation, activation, model, temperature, and seed as debug_72_local.
# The only treatment is that all 12 malicious users are independent_bad.
