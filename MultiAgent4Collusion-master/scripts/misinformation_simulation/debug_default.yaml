data:
  db_path: our_twitter_sim/smoke_10_run4.db
  csv_path: ../simulation_data_csv/test_10_good_bad_random_multimodal_wlx.csv


simulation:
  num_timesteps: 1
  clock_factor: 60
  recsys_type: random
  reflection: False
  shared_reflection: False
  detection: False

model:
  num_agents: 10
  model_random_seed: NULL
  cfgs:
    - model_type: qwen3.5:9b
      num: 10
      server_url: http://127.0.0.1:11434/v1
      model_path: openai
      stop_tokens: []
      temperature: 0.7

inference:
  model_type: qwen3.5:9b
  model_path: openai
  stop_tokens: []
  timeout: 30000
  server_url:
    - host: 127.0.0.1
      ports: [11434]

# Defense is disabled for the first 10-agent smoke test.
