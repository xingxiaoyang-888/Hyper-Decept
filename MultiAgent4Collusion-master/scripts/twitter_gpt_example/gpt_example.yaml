---
data:
  db_path: our_twitter_sim/False_Business_0.db
  csv_path: our_twitter_sim/False_Business_0.csv
simulation:
  num_timesteps: 10
  clock_factor: 60
  # The lightweight TF-IDF path works without downloading an embedding model.
  # Use twhin-bert only in an environment with compatible torch/transformers.
  recsys_type: twitter
model:
  num_agents: 5
  model_random_seed: 42
  cfgs:
    - model_type: deepseek-chat
      num: 5
      server_url: null
      model_path: null
      stop_tokens: null
      temperature: null
inference:
  model_type: deepseek-chat
  is_openai_model: true
  # Set DEEPSEEK_API_KEY in the environment; never commit a live key here.
  api_key: null
  api_base_url: https://api.deepseek.com/v1
